<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清华小助手</title>
<style>
  /* ===== Design Tokens · 深色为默认主题（清华紫 #82318E 作强调） ===== */
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    /* 表面层次 */
    --bg: #111113;            /* 页面底 */
    --bg-soft: #18181b;       /* Header / 输入区 */
    --card: #1e1e22;          /* AI 消息卡片 */
    --card-hover: #26262b;
    --inset: #0c0c0e;         /* 内嵌区域（缩略图底等） */
    /* 文字 */
    --text: #ececf1;
    --text-2: #a6a6b0;        /* 次级 */
    --muted: #73737d;
    /* 线 */
    --border: #2c2c33;
    --border-soft: #232329;
    /* 品牌清华紫 */
    --primary: #8f3fa3;       /* 交互主色 */
    --primary-strong: #82318e;
    --primary-bright: #c79ad3;/* 深底上的紫文字 */
    --primary-soft: #a855f7;  /* glow / 高光 */
    --primary-light: rgba(143, 63, 163, 0.16);
    --grad-user: linear-gradient(135deg, #7c2f8e, #9a44ae);
    --ring: rgba(168, 85, 247, 0.20);
    /* 语义色 */
    --ok: #34d399;
    --err: #f87171;
    --tool: #6ea8fe;
    /* 圆角 / 阴影 / 字号 */
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-2: 0 8px 28px rgba(0, 0, 0, 0.40);
    --fs-body: 15px; --fs-sm: 13px; --fs-xs: 12px;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f6f8;
    --bg-soft: #ffffff;
    --card: #ffffff;
    --card-hover: #f2f2f5;
    --inset: #ededf0;
    --text: #1b1b20;
    --text-2: #55555f;
    --muted: #8a8a94;
    --border: #e3e3e9;
    --border-soft: #ebebf0;
    --primary: #82318e;
    --primary-strong: #6d2879;
    --primary-bright: #8f3fa3;
    --primary-soft: #a855f7;
    --primary-light: #f5ebf7;
    --grad-user: linear-gradient(135deg, #82318e, #a13fb5);
    --ring: rgba(130, 49, 142, 0.18);
    --ok: #16a34a;
    --err: #dc2626;
    --tool: #0369a1;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.06);
    --shadow-2: 0 8px 28px rgba(0, 0, 0, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    background: color-mix(in srgb, var(--bg-soft) 85%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--grad-user); color: #fff;
    display: grid; place-items: center; font-size: 16px;
    box-shadow: var(--shadow-1);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
  .brand-name { font-weight: 600; font-size: 15px; }
  .brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
  .conn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--fs-xs); color: var(--text-2);
    padding: 6px 10px; border: 1px solid var(--border-soft); border-radius: 999px;
  }
  .conn-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent);
  }
  .conn[hidden] { display: none; }
  #chat {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
    padding: 28px max(24px, calc((100% - 1040px) / 2)); /* 大屏居中聊天内容 */
  }
  .msg {
    max-width: 82%; padding: 12px 16px; border-radius: var(--r-lg);
    line-height: 1.7; white-space: pre-wrap; word-break: break-word;
    font-size: var(--fs-body); box-shadow: var(--shadow-1);
    animation: msg-in 0.22s ease;
  }
  .msg.user {
    align-self: flex-end; max-width: 72%;
    background: var(--grad-user); color: #fff;
    border-radius: var(--r-lg) var(--r-lg) 4px var(--r-lg);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--card); border: 1px solid var(--border-soft);
    border-radius: var(--r-lg) var(--r-lg) var(--r-lg) 4px;
  }
  @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg .saved-att { display: block; margin-bottom: 6px; font-size: var(--fs-xs); opacity: 0.8; }
  .msg .cursor { display: inline-block; width: 8px; height: 15px; background: var(--primary-soft); vertical-align: -2px; animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* Thinking Card：Agent 处理过程的实时状态（文档四/六/九/十） */
  .thinking {
    align-self: flex-start; width: min(480px, 88%);
    background: var(--card); border: 1px solid var(--border-soft);
    border-radius: var(--r-lg) var(--r-lg) var(--r-lg) 4px;
    overflow: hidden; box-shadow: var(--shadow-1);
    animation: msg-in 0.22s ease;
  }
  .thinking.removing { opacity: 0; transform: translateY(-4px); transition: opacity 0.25s, transform 0.25s; }
  .think-bar {
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary-soft), transparent);
    background-size: 50% 100%;
    animation: think-shimmer 1.4s linear infinite;
  }
  @keyframes think-shimmer { from { background-position: -60% 0; } to { background-position: 160% 0; } }
  .think-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px; font-size: 14px; font-weight: 600; }
  .think-head .spark { color: var(--primary-bright); }
  .think-time { margin-left: auto; font-size: var(--fs-xs); color: var(--muted); font-weight: 400; }
  .think-steps { display: flex; flex-direction: column; gap: 7px; padding: 0 16px 12px; }
  .think-step { display: flex; align-items: center; gap: 9px; font-size: var(--fs-sm); color: var(--text-2); }
  .think-step .dot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--muted); background: transparent;
  }
  .think-step.active .dot {
    border-color: var(--primary-soft); background: var(--primary-soft);
    animation: think-pulse 1.2s ease infinite;
  }
  @keyframes think-pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary-soft) 22%, transparent); } }
  .think-step.done { color: var(--muted); }
  .think-step.done .dot { border-color: var(--ok); background: var(--ok); }
  .think-step.fail { color: var(--err); }
  .think-step.fail .dot { border-color: var(--err); background: var(--err); }
  .think-step .ms { margin-left: auto; font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
  /* 错误卡片：人话文案 + 可折叠技术详情 + 重新生成（文档十六/十七） */
  .error-card {
    align-self: flex-start; width: min(480px, 88%);
    background: color-mix(in srgb, var(--err) 6%, var(--card));
    border: 1px solid color-mix(in srgb, var(--err) 30%, transparent);
    border-radius: var(--r-lg) var(--r-lg) var(--r-lg) 4px;
    padding: 14px 16px; box-shadow: var(--shadow-1); animation: msg-in 0.22s ease;
  }
  .err-head { font-weight: 600; font-size: 14px; color: var(--err); }
  .err-body { font-size: var(--fs-sm); color: var(--text-2); margin-top: 6px; line-height: 1.6; }
  .err-detail { margin-top: 10px; font-size: var(--fs-xs); }
  .err-detail summary { color: var(--muted); cursor: pointer; width: fit-content; }
  .err-detail pre {
    margin-top: 6px; padding: 8px 10px; background: var(--inset); border-radius: var(--r-sm);
    white-space: pre-wrap; word-break: break-all; color: var(--muted);
    max-height: 160px; overflow: auto;
  }
  .err-actions { margin-top: 12px; }
  .err-retry {
    border: 1px solid color-mix(in srgb, var(--err) 40%, transparent);
    background: transparent; color: var(--text); font-size: var(--fs-sm);
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
  }
  .err-retry:hover { background: color-mix(in srgb, var(--err) 10%, transparent); }
  /* Toast：系统通知与 AI 回复分离（文档十五） */
  #toasts {
    position: fixed; top: 64px; right: 20px; z-index: 50;
    display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  }
  .toast {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-left: 3px solid var(--primary);
    border-radius: var(--r-md); padding: 10px 16px; font-size: var(--fs-sm);
    box-shadow: var(--shadow-2); animation: toast-in 0.25s ease;
  }
  .toast.ok { border-left-color: var(--ok); }
  .toast.err { border-left-color: var(--err); }
  .toast.out { opacity: 0; transform: translateX(12px); transition: opacity 0.3s, transform 0.3s; }
  @keyframes toast-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  /* 回到底部按钮（文档二十八） */
  #scroll-btn {
    position: fixed; right: 24px; bottom: 130px; z-index: 5;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card); color: var(--text-2);
    cursor: pointer; box-shadow: var(--shadow-1); font-size: 16px; line-height: 1;
  }
  #scroll-btn:hover { color: var(--text); background: var(--card-hover); }
  #scroll-btn[hidden] { display: none; }
  /* Welcome Screen：空对话状态 + 快捷问题（文档十四） */
  #welcome { align-self: center; text-align: center; padding: 9vh 16px 0; width: min(560px, 100%); }
  .w-spark { font-size: 30px; color: var(--primary-bright); }
  .w-title { font-size: 22px; font-weight: 600; margin-top: 12px; }
  .w-sub { font-size: var(--fs-sm); color: var(--muted); margin-top: 10px; line-height: 1.6; }
  .w-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
  .w-card {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--r-lg);
    color: var(--text); font-size: var(--fs-sm); cursor: pointer; text-align: left;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .w-card:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-1px); }
  .w-ico { font-size: 18px; }
  #welcome[hidden] { display: none; }
  @media (max-width: 560px) { .w-grid { grid-template-columns: 1fr; } }
  /* Markdown 渲染样式（文档十九）：层级清晰、克制 */
  .msg.md { white-space: normal; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h1, .md h2, .md h3, .md h4 {
    font-size: 15.5px; font-weight: 600; margin: 14px 0 8px;
  }
  .md ul, .md ol { margin: 6px 0 10px; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
  .md strong { font-weight: 600; }
  .md code {
    background: var(--inset); padding: 2px 6px; border-radius: 6px;
    font-size: 13px; font-family: ui-monospace, Consolas, "Courier New", monospace;
  }
  .md pre { background: var(--inset); padding: 10px 12px; border-radius: var(--r-md); overflow-x: auto; margin: 8px 0; }
  .md pre code { background: transparent; padding: 0; }
  .md table { border-collapse: collapse; margin: 8px 0 12px; font-size: 13.5px; width: 100%; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md th { background: var(--inset); font-weight: 600; }
  .md td { font-variant-numeric: tabular-nums; }
  .md blockquote {
    border-left: 3px solid var(--primary); margin: 8px 0; padding: 2px 12px;
    color: var(--text-2); background: var(--primary-light);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
  }
  .md a { color: var(--tool); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .qr-card { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
  .qr-card img { width: 220px; height: 220px; }
  .qr-card .url { font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 8px; max-width: 260px; }
  .pay-card { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; max-width: 320px; }
  .pay-card button { padding: 10px 24px; border: none; border-radius: 9px; background: var(--primary); color: #fff; font-size: 14px; cursor: pointer; }
  .pay-card .tip { font-size: 12px; color: var(--muted); margin-top: 8px; }
  /* Composer：卡片式输入区（文档十二） */
  #composer-wrap { padding: 12px max(24px, calc((100% - 1040px) / 2)) 20px; }
  #composer {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: var(--r-xl); padding: 10px 12px 8px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #composer:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
  #q {
    display: block; width: 100%; border: none; background: transparent; color: var(--text);
    font-size: var(--fs-body); line-height: 1.55; outline: none; resize: none;
    min-height: 24px; max-height: 140px; font-family: inherit;
  }
  #q::placeholder { color: var(--muted); }
  .composer-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .composer-hint { margin-left: auto; font-size: var(--fs-xs); color: var(--muted); }
  @media (max-width: 640px) { .composer-hint { display: none; } }
  #composer .iconbtn { background: transparent; }
  .iconbtn {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--r-md);
    background: transparent; color: var(--text); font-size: 16px; cursor: pointer;
  }
  .iconbtn.off { opacity: 0.35; }
  #mic.recording {
    background: var(--err); color: #fff; border-color: var(--err);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--err) 22%, transparent); } }
  /* 待发送图片缩略图条 */
  #thumbs { display: flex; gap: 8px; padding: 0 4px 8px; }
  #thumbs[hidden] { display: none; }
  #thumbs .thumb { position: relative; }
  #thumbs img { height: 56px; border-radius: 8px; border: 1px solid var(--border); display: block; }
  #thumbs .rm {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;
    border-radius: 50%; border: none; background: var(--err); color: #fff;
    font-size: 11px; cursor: pointer; line-height: 1;
  }
  /* 用户气泡里的图片 */
  .msg.user img.att { max-width: 220px; border-radius: 8px; display: block; margin-bottom: 6px; }
  /* 顶栏右侧开关 */
  header { display: flex; align-items: center; }
  header .ctl { margin-left: auto; display: flex; gap: 8px; }
  header .iconbtn { padding: 5px 10px; font-size: 14px; }
  #login-btn { padding: 7px 14px; border: 0; border-radius: 9px; background: var(--primary); color: #fff; font-size: 13px; cursor: pointer; }
  #login-btn.logged-in { background: var(--primary-light); color: var(--primary); border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); }
  #send {
    padding: 8px 20px; border: none; border-radius: 999px; background: var(--primary);
    color: #fff; font-size: var(--fs-sm); font-weight: 500; cursor: pointer;
    transition: background 0.15s;
  }
  #send:hover:not(:disabled) { background: var(--primary-strong); }
  #send:disabled { opacity: 0.45; cursor: not-allowed; }
  /* 确认弹窗 */
  #modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #modal-mask.show { display: flex; }
  #modal {
    background: var(--card); border-radius: 14px; padding: 22px; width: min(440px, 92vw);
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  #modal h3 { font-size: 16px; margin-bottom: 4px; }
  #modal .warn { color: var(--err); font-size: 13px; margin-bottom: 14px; }
  #modal table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 18px; }
  #modal td { padding: 7px 10px; border: 1px solid var(--border); word-break: break-all; }
  #modal td:first-child { color: var(--muted); white-space: nowrap; width: 30%; }
  #modal .btns { display: flex; gap: 12px; justify-content: flex-end; }
  #modal button { padding: 9px 22px; border-radius: 9px; font-size: 14px; cursor: pointer; border: none; }
  #btn-ok { background: var(--ok); color: #fff; }
  #btn-no { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #auth-mask {
    position: fixed; inset: 0; background: rgba(8, 12, 24, 0.58);
    display: none; align-items: center; justify-content: center; z-index: 20;
    padding: 20px;
  }
  #auth-mask.show { display: flex; }
  #auth-modal {
    width: min(430px, 100%); background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 20px; padding: 28px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
  }
  #auth-modal .auth-badge {
    width: 46px; height: 46px; display: grid; place-items: center;
    border-radius: 14px; background: var(--primary-light); font-size: 24px;
    margin-bottom: 16px;
  }
  #auth-modal h3 { font-size: 20px; margin-bottom: 8px; }
  #auth-status { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
  #auth-status.error { color: var(--err); }
  #auth-phone { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  #auth-login-fields { display: grid; gap: 12px; margin: 18px 0 4px; }
  #auth-login-fields[hidden] { display: none; }
  #auth-login-fields label { color: var(--muted); font-size: 13px; }
  #auth-login-fields input {
    display: block; width: 100%; margin-top: 6px; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none;
  }
  #auth-login-fields input:focus { border-color: var(--primary); }
  #auth-login-tip { color: var(--muted); font-size: 12px; line-height: 1.5; }
  #auth-login-tip[hidden] { display: none; }
  #auth-methods { display: grid; gap: 10px; margin: 18px 0 8px; }
  .auth-method {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px;
    color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; cursor: pointer; text-align: left; font-size: 14px;
  }
  .auth-method:hover { border-color: var(--primary); background: var(--primary-light); }
  .auth-method .auth-method-icon { font-size: 20px; }
  #auth-code-wrap { display: block; color: var(--muted); font-size: 13px; margin: 18px 0; }
  #auth-code-wrap[hidden], #auth-methods[hidden], #auth-submit[hidden], #auth-phone[hidden] { display: none; }
  #auth-code {
    display: block; width: 100%; margin-top: 8px; padding: 12px 13px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 20px; letter-spacing: 0.18em; outline: none;
  }
  #auth-code:focus { border-color: var(--primary); }
  #auth-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  #auth-actions button {
    border: 0; border-radius: 10px; padding: 10px 18px; font-size: 14px; cursor: pointer;
  }
  #auth-cancel { color: var(--text); background: var(--bg); border: 1px solid var(--border) !important; }
  #auth-submit { color: #fff; background: var(--primary); }
  #auth-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>

<body>
<header title="单用户本地模式 · 写操作会弹窗确认 · 支持语音/图片输入">
  <div class="brand">
    <div class="logo">✦</div>
    <div class="brand-text">
      <span class="brand-name">清华小助手</span>
      <span class="brand-sub">Tsinghua AI Assistant</span>
    </div>
  </div>
  <span class="ctl">
    <span id="conn-status" class="conn" hidden><span class="conn-dot"></span>清华 Info 已连接</span>
    <button id="login-btn" type="button">登录</button>
    <button id="theme-toggle" class="iconbtn" type="button" title="切换到浅色模式">🌞</button>
    <button id="tts-toggle" class="iconbtn" title="朗读回复开关">🔊</button>
    <button id="snd-toggle" class="iconbtn" title="提示音效开关">🔔</button>
  </span>
</header>
<div id="chat">
  <div id="welcome" hidden>
    <div class="w-spark">✦</div>
    <h1 class="w-title">今天想在清华做点什么？</h1>
    <p class="w-sub" id="w-login-hint">登录清华账号后可以查询课表、约场馆、看电费——先点击右上角「登录」</p>
    <div class="w-grid">
      <button class="w-card" type="button" data-q="我今天有什么课？"><span class="w-ico">📚</span><span>查今天的课表</span></button>
      <button class="w-card" type="button" data-q="今晚哪里可以打羽毛球？"><span class="w-ico">🏃</span><span>查场馆空位</span></button>
      <button class="w-card" type="button" data-q="帮我看看图书馆哪里有位置"><span class="w-ico">📖</span><span>图书馆座位</span></button>
      <button class="w-card" type="button" data-q="我明天下午有什么空闲时间？"><span class="w-ico">🗓️</span><span>找空闲时间</span></button>
    </div>
  </div>
</div>
<div id="toasts"></div>
<button id="scroll-btn" type="button" title="回到底部" hidden>↓</button>
<div id="composer-wrap">
  <div id="thumbs" hidden></div>
  <div id="composer">
    <textarea id="q" rows="1" placeholder="问点什么，如：今晚哪里可以打羽毛球？" autocomplete="off"></textarea>
    <div class="composer-row">
      <button id="attach" class="iconbtn" title="发送图片">📎</button>
      <button id="mic" class="iconbtn" title="语音输入">🎤</button>
      <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
      <button id="send" disabled>发送</button>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
    </div>
  </div>
</div>

<div id="modal-mask">
  <div id="modal">
    <h3 id="modal-title">⚠️ 写操作确认</h3>
    <div id="modal-warn" class="warn">助手要执行下面的操作，确认后才会真正执行：</div>
    <table id="modal-args"></table>
    <div class="btns">
      <button id="btn-no">取消</button>
      <button id="btn-ok">确认执行</button>
    </div>
  </div>
</div>

<div id="auth-mask" aria-hidden="true">
  <div id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="auth-badge">🔐</div>
    <h3 id="auth-title">登录清华小助手</h3>
    <p id="auth-status">使用清华 Info 账号登录，凭证只会发送到本机服务。</p>
    <div id="auth-login-fields">
      <label>学号<input id="auth-username" type="text" inputmode="numeric" autocomplete="username" maxlength="128" placeholder="输入学号"></label>
      <label>密码<input id="auth-password" type="password" autocomplete="current-password" maxlength="512" placeholder="输入密码"></label>
      <span id="auth-login-tip">登录成功后，本机会话可能登记为可信设备；可在清华身份认证页面撤销。</span>
    </div>
    <p id="auth-phone" hidden></p>
    <div id="auth-methods"></div>
    <label id="auth-code-wrap" hidden>
      验证码
      <input id="auth-code" inputmode="numeric" autocomplete="one-time-code" maxlength="128" placeholder="输入验证码">
    </label>
    <div id="auth-actions">
      <button id="auth-cancel" type="button">取消</button>
      <button id="auth-submit" type="button">开始登录</button>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const q = document.getElementById("q");
const sendBtn = document.getElementById("send");
const mask = document.getElementById("modal-mask");
const authMask = document.getElementById("auth-mask");
const authStatus = document.getElementById("auth-status");
const loginBtn = document.getElementById("login-btn");
const authLoginFields = document.getElementById("auth-login-fields");
const authLoginTip = document.getElementById("auth-login-tip");
const authUsername = document.getElementById("auth-username");
const authPassword = document.getElementById("auth-password");
const authPhone = document.getElementById("auth-phone");
const authMethods = document.getElementById("auth-methods");
const authCodeWrap = document.getElementById("auth-code-wrap");
const authCode = document.getElementById("auth-code");
const authSubmit = document.getElementById("auth-submit");
const authCancel = document.getElementById("auth-cancel");
const modalTitle = document.getElementById("modal-title");
const modalWarn = document.getElementById("modal-warn");
const modalArgs = document.getElementById("modal-args");
const modalOk = document.getElementById("btn-ok");
const modalNo = document.getElementById("btn-no");
let busy = false;
let authRequestId = null;
let authPhase = null;
let authOrigin = null;
let authSubmitting = false;
let loginInFlight = false;
let loginAbortController = null;
let authCancelRequested = false;
let authenticated = false;
const authMethodLabels = {
  totp: {icon: "🔢", label: "验证器动态码", hint: "使用验证器 App 中的当前验证码"},
  mobile: {icon: "📱", label: "短信验证码", hint: "向已绑定手机号发送验证码"},
  wechat: {icon: "💬", label: "微信验证", hint: "使用清华身份认证关联的微信"},

/* 智能滚动：贴底时自动跟随；用户上翻则停止强滚并显示"回到底部" */

function saveChatHistory() {
  const records = [...chat.children]
    .filter((node) => node.classList.contains("msg"))
    .map((node) => ({
      role: node.classList.contains("user") ? "user" : "bot",
      text: (node.dataset.raw ?? [...node.childNodes]
        .filter((child) => child.nodeType === Node.TEXT_NODE)
        .map((child) => child.textContent ?? "")
        .join(""))
        .slice(0, MAX_SAVED_TEXT_LENGTH),
      imageCount: node.querySelectorAll("img.att").length,
    }))
    .slice(-MAX_SAVED_MESSAGES);
  store.set(CHAT_HISTORY_KEY, JSON.stringify(records));
}

function restoreChatHistory() {
  let records;
  try { records = JSON.parse(store.get(CHAT_HISTORY_KEY, "[]")); } catch { records = []; }
  if (!Array.isArray(records)) return;
  for (const record of records) {
    if (!record || (record.role !== "user" && record.role !== "bot") || typeof record.text !== "string") continue;
    const div = document.createElement("div");
    div.className = "msg " + record.role;
    if (record.role === "bot") {
      renderMd(div, record.text); // AI 消息按 Markdown 恢复
      chat.appendChild(div);
      continue;
    }
    if (Number.isInteger(record.imageCount) && record.imageCount > 0) {
      const attachment = document.createElement("span");
      attachment.className = "saved-att";
      attachment.textContent = `🖼️ ${record.imageCount} 张图片附件（刷新后不保留预览）`;
      div.appendChild(attachment);
    }
    div.appendChild(document.createTextNode(record.text));
    chat.appendChild(div);
  }
  updateWelcome();
  scrollDown();
}

function clearChatHistory() {
  chat.replaceChildren();

let audioCtx = null;
function beep(freq, dur = 0.07, type = "sine") {
  if (!soundOn) return;
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = 0.045;
    o.connect(g).connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch { /* 无音频设备/被浏览器限制时静默 */ }
}
const sfx = {
  send: () => beep(660),
  toolOk: () => beep(880, 0.05),
  toolFail: () => beep(220, 0.14, "square"),
  confirm: () => { beep(520, 0.08); setTimeout(() => beep(780, 0.1), 110); },
  error: () => beep(180, 0.2, "square"),
};

/* TTS：朗读最终回答（用系统中文语音，没有就用默认） */
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.startsWith("zh"));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch { /* 浏览器不支持时静默 */ }
}

const TOOL_LABELS = {

  get_campus_card_info: "校园卡信息", recharge_campus_card: "校园卡充值",

  get_sports_resources: "体育场馆", book_sports_field: "预约体育场馆", pay_sports_order: "体育订单支付",
};
const toolLabel = (name) => TOOL_LABELS[name] ?? name;

function createThinkingCard() {
  const card = document.createElement("div");
  card.className = "thinking";
  card.innerHTML =
    '<div class="think-bar"></div>' +
    '<div class="think-head"><span class="spark">✦</span><span>清华小助手正在处理</span><span class="think-time">0s</span></div>' +
    '<div class="think-steps"></div>';
  chat.appendChild(card);
  scrollDown();

  const steps = card.querySelector(".think-steps");
  const timeEl = card.querySelector(".think-time");
  const t0 = Date.now();
  const timer = setInterval(() => {
    timeEl.textContent = Math.floor((Date.now() - t0) / 1000) + "s";
  }, 500);

  // 模拟阶段文案按时间轮换（真实工具行会并行插入，见 addTool）
  const phases = ["正在理解你的问题", "正在查询校园信息", "正在整理结果"];
  let phaseIdx = 0;
  let statusStep = null;
  const phaseTimer = setInterval(() => {
    phaseIdx = Math.min(phaseIdx + 1, phases.length - 1);
    setStatus(phases[phaseIdx]);
  }, 3500);

  const mkStep = (text, state) => {
    const el = document.createElement("div");
    el.className = "think-step " + state;
    el.innerHTML = `<span class="dot"></span><span>${text}</span>`;
    steps.appendChild(el);
    scrollDown();
    return el;
  };
  const setStatus = (text) => {
    if (statusStep) statusStep.remove();
    statusStep = mkStep(text, "active");
  };
  setStatus(phases[0]);

  let dismissed = false;
  const dismiss = () => {
    if (dismissed) return;
    dismissed = true;
    clearInterval(timer);
    clearInterval(phaseTimer);
    card.classList.add("removing");
    setTimeout(() => card.remove(), 260);
  };
  const addTool = (name) => mkStep(`正在查询「${toolLabel(name)}」…`, "active");
  const finishTool = (el, e) => {
    el.className = "think-step " + (e.success === false ? "fail" : "done");
    el.querySelector("span:last-child").textContent =
      `「${toolLabel(e.name)}」${e.success === false ? "查询失败" : "完成"}`;
    if (e.ms != null) {
      const ms = document.createElement("span");
      ms.className = "ms";
      ms.textContent = (e.ms / 1000).toFixed(1) + "s";
      el.appendChild(ms);
    }
    scrollDown();
  };
  return {el: card, addTool, finishTool, dismiss};
}

/* ---- Markdown 渲染（marked 内联库）：仅对最终回答渲染，流式过程保持纯文本 ---- */
function renderMd(el, raw) {
  el.classList.add("md");
  el.dataset.raw = raw;          // 历史保存用原始 Markdown
  el.innerHTML = marked.parse(raw);
  // 安全清理：移除脚本类节点与内联事件，外链加固
  el.querySelectorAll("script, style, iframe, object, embed, form, link, meta").forEach((n) => n.remove());
  el.querySelectorAll("*").forEach((n) => {
    for (const attr of [...n.attributes]) {
      const bad = /^on/i.test(attr.name) ||
        ((attr.name === "href" || attr.name === "src") && /^\s*javascript:/i.test(attr.value));
      if (bad) n.removeAttribute(attr.name);
    }
  });
  el.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
}

/* ---- 错误卡片：技术错误转人话 + 可折叠详情 + 重新生成 ---- */
const ERROR_HINTS = [
  {re: /concurrent request limit|HTTP 429/i, title: "AI 服务暂时繁忙", body: "当前请求较多，请稍等片刻再试。"},
  {re: /HTTP 40[13]/, title: "AI 服务拒绝请求", body: "可能是额度或配置问题，请稍后再试。"},
  {re: /timeout|ETIMEDOUT|aborted/i, title: "请求超时", body: "服务响应太慢或网络不稳定，请重试。"},
  {re: /fetch failed|network|ECONN/i, title: "网络连接失败", body: "请检查网络连接后重试。"},
];
function humanizeError(raw) {
  for (const h of ERROR_HINTS) if (h.re.test(raw)) return h;
  return {title: "出了点问题", body: "刚才的操作没有成功，请重试。"};
}

let lastQuestion = null;   // 供"重新生成"使用

  const hint = humanizeError(raw);
  const card = document.createElement("div");
  card.className = "error-card";
  card.innerHTML =
    `<div class="err-head">⚠️ ${hint.title}</div>` +
    `<div class="err-body">${hint.body}</div>` +
    '<details class="err-detail"><summary>技术详情</summary><pre></pre></details>' +
    '<div class="err-actions"><button class="err-retry" type="button">↻ 重新生成</button></div>';
  card.querySelector("pre").textContent = raw;
  card.querySelector(".err-retry").onclick = () => {
    card.remove();
    if (lastQuestion == null && !(lastImages ?? []).length) return;
    const text = lastQuestion, imgs = lastImages;
    lastQuestion = null; lastImages = null;
    addUserMsg(text, imgs);
    sfx.send();
    ask(text, imgs).catch((e) => { showErrorCard("网络错误：" + e.message); sfx.error(); });
  };
  chat.appendChild(card);
  updateWelcome();
  scrollDown();
}

function showAuthMethod(data) {
  authRequestId = typeof data.id === "string" ? data.id : null;
  authPhase = "method";

  authLoginTip.hidden = true;

    if (!info) continue;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "auth-method";

    icon.className = "auth-method-icon";
    icon.textContent = info.icon;
    const text = document.createElement("span");
    text.innerHTML = `<strong>${info.label}</strong><br><small>${info.hint}</small>`;
    button.append(icon, text);
    button.onclick = () => submitAuthMethod(method);
    authMethods.append(button);
  }
}

async function submitAuthMethod(method) {
  if (!authRequestId || authSubmitting) return;
  authSubmitting = true;
  const buttons = authMethods.querySelectorAll("button");
  buttons.forEach((button) => { button.disabled = true; });
  setAuthMessage(method === "mobile" ? "正在发送短信验证码…" : "正在切换认证方式…");
  try {
    const resp = await fetch("/api/auth/method", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: authRequestId, method}),
    });
    if (!resp.ok) throw new Error(await resp.text());
  } catch (e) {
    setAuthMessage(`认证方式提交失败：${e.message}`, true);
    buttons.forEach((button) => { button.disabled = false; });
  } finally {
    authSubmitting = false;
  }
}

function showAuthCode(data) {
  authRequestId = typeof data.id === "string" ? data.id : authRequestId;
  authPhase = "code";
  if (!authOrigin) authOrigin = "chat";
  authMask.classList.add("show");
  authMask.setAttribute("aria-hidden", "false");
  authMethods.hidden = true;
  authLoginFields.hidden = true;
  authLoginTip.hidden = true;
  authPhone.hidden = true;
  authCodeWrap.hidden = false;
  authSubmit.hidden = false;
  authSubmit.textContent = "提交验证码";
  authSubmit.disabled = false;
  authCancel.disabled = false;
  setAuthMessage("验证码已发送，请输入后提交");
  window.setTimeout(() => authCode.focus(), 0);
}

async function submitAuthCode() {
  if (!authRequestId || authSubmitting) return;
  const code = authCode.value.trim();
  if (!code) {
    setAuthMessage("请输入验证码", true);
    authCode.focus();
    return;
  }
  authSubmitting = true;
  authSubmit.disabled = true;
  authCancel.disabled = true;
  setAuthMessage("正在验证，请稍候…");
  try {
    const resp = await fetch("/api/auth/code", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: authRequestId, code}),
    });
    if (!resp.ok) throw new Error(await resp.text());
  } catch (e) {
    setAuthMessage(`验证码提交失败：${e.message}`, true);
    authSubmit.disabled = false;
    authCancel.disabled = false;
  } finally {
    authSubmitting = false;
  }
}

function handleAuthEvent(data) {
  if (data.phase === "method") {
    showAuthMethod(data);
  } else if (data.phase === "code") {
    showAuthCode(data);
  } else if (data.phase === "success") {
    if (authOrigin === "login") {
      const newlyAuthenticated = !authenticated;
      authenticated = true;
      updateLoginButton();
      if (newlyAuthenticated) {
        toast("✓ 登录成功，已连接清华 Info", "ok");
      }
    }
    setAuthMessage("认证成功，正在继续查询…");
    window.setTimeout(closeAuthModal, 600);
  } else if (data.phase === "error") {
    if (authCancelRequested) {
      authCancelRequested = false;
      return;
    }
    const message = data.message || "二次认证失败，请重试。";
    if (authOrigin === "login") {
      setAuthMessage(message, true);
      authPhase = "login";
      authRequestId = null;
      authLoginFields.hidden = false;
      authLoginTip.hidden = false;
      authMethods.hidden = true;
      authCodeWrap.hidden = true;
      authPhone.hidden = true;
      authSubmit.hidden = false;
      authSubmit.textContent = "重新登录";
      authSubmit.disabled = false;
      authCancel.disabled = false;
    } else {
      openLoginModal();
      setAuthMessage(`校园登录已过期：${message} 请重新登录。`, true);
    }
  }
}

async function startLogin() {
  if (loginInFlight) return;
  const username = authUsername.value.trim();
  const password = authPassword.value;
  if (!username || !password) {
    setAuthMessage("请输入学号和密码", true);
    return;
  }
  loginInFlight = true;
  authSubmitting = true;
  authOrigin = "login";
  authPhase = "login";
  authRequestId = null;
  loginAbortController = new AbortController();
  authSubmit.disabled = true;
  authCancel.disabled = true;
  setAuthMessage("正在登录清华账号，请稍候…");
  try {
    const resp = await fetch("/api/auth/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      signal: loginAbortController.signal,
      body: JSON.stringify({username, password}),
    });
    if (!resp.ok) throw new Error(await resp.text());
    authSubmitting = false;
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const block = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        const ev = /^event: (.*)$/m.exec(block)?.[1];
        const dataStr = /^data: (.*)$/m.exec(block)?.[1];
        if (!ev || !dataStr) continue;
        let data;
        try { data = JSON.parse(dataStr); } catch { continue; }
        if (ev === "auth") handleAuthEvent(data);
      }
    }
  } catch (e) {
    if (e?.name !== "AbortError") setAuthMessage(`登录请求失败：${e.message}`, true);
  } finally {
    loginInFlight = false;
    loginAbortController = null;
    authSubmitting = false;
    authPassword.value = "";
    authCancel.disabled = false;
    if (!authenticated) authSubmit.disabled = false;
    updateLoginButton();
  }
}

loginBtn.onclick = () => { if (authenticated) showLogoutConfirm(); else openLoginModal(); };
authCancel.onclick = () => { void cancelAuth(); };
authSubmit.onclick = () => { if (authPhase === "code") void submitAuthCode(); else void startLogin(); };
authCode.addEventListener("keydown", (e) => {
  if (e.key === "Enter") void submitAuthCode();
});

fetch("/api/auth/status").then((resp) => resp.json()).then((data) => {
  authenticated = data.authenticated === true;
  updateLoginButton();
  updateWelcome();
}).catch(() => {
  updateLoginButton();
  updateWelcome();
});

/* ---- SSE 解析（fetch 流，EventSource 不支持 POST） ---- */
async function ask(question, images) {
  busy = true;
  sendBtn.disabled = true;
  lastQuestion = question;  // 供失败后"重新生成"
  lastImages = images;
  const thinking = createThinkingCard(); // 立即出现，不等 API
  const resp = await fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({question, ...(images?.length ? {images} : {})}),
  });
  if (!resp.ok) {
    thinking.dismiss();
    const message = await resp.text();
    if (resp.status === 401) {
      authenticated = false;
      updateLoginButton();
      toast("请先登录清华账号后再使用校园功能", "err");
    } else {
      showErrorCard(message);
    }
    sfx.error();
    busy = false;
    updateLoginButton();
    return;
  }

  let botDiv = null;       // 当前流式回答的气泡
  let botText = "";
  const chips = new Map(); // 进行中的工具状态行

  const ensureBot = () => {
    thinking.dismiss(); // 首个 token 到达，收起 Thinking Card
    if (!botDiv) {
      botDiv = addMsg("bot", "");
      botDiv.innerHTML = '<span class="cursor"></span>';
    }
    return botDiv;
  };
  const renderBot = () => {
    if (botDiv) botDiv.innerHTML = "";
    if (botDiv) {
      botDiv.appendChild(document.createTextNode(botText));
      const c = document.createElement("span");
      c.className = "cursor";
      botDiv.appendChild(c);
      scrollDown();
    }
  };

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    let idx;
    while ((idx = buffer.indexOf("\n\n")) !== -1) {
      const block = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      const ev = /^event: (.*)$/m.exec(block)?.[1];
      const dataStr = /^data: (.*)$/m.exec(block)?.[1];
      if (!ev || !dataStr) continue;
      let data;
      try { data = JSON.parse(dataStr); } catch { continue; }

      if (ev === "token") {
        botText += data.text;
        ensureBot();
        renderBot();
      } else if (ev === "tool") {
        if (data.phase === "start") {
          chips.set(data.name, thinking.addTool(data.name));
        } else {
          const chip = chips.get(data.name);
          if (chip) { thinking.finishTool(chip, data); chips.delete(data.name); }
          if (data.success === false) sfx.toolFail(); else sfx.toolOk();
        }
      } else if (ev === "confirm") {
        sfx.confirm();
        showConfirm(data);
      } else if (ev === "auth") {
        handleAuthEvent(data);
      } else if (ev === "qr") {
        showQr(data);
      } else if (ev === "payform") {
        showPayForm(data);
      } else if (ev === "answer") {
        // 最终回答校对：以完整 answer 为准，并渲染 Markdown
        botText = data.text;
        ensureBot();
        renderMd(botDiv, botText);
        saveChatHistory();
        scrollDown();
        if (ttsOn && botText) speak(botText);
      } else if (ev === "error") {
        thinking.dismiss();
        showErrorCard(data.message);
        sfx.error();
      }
    }
  }
  // 流结束：去掉光标、渲染最终 Markdown、确保 Thinking Card 已收起
  thinking.dismiss();
  if (botDiv) {
    renderMd(botDiv, botText);
    saveChatHistory();
  }
  busy = false;
  sendBtn.disabled = false;
  q.focus();
}

/* 统一发送入口：发送按钮与"重新生成"共用 */
function submit(text, imgs) {
  if ((!text && imgs.length === 0) || busy) return;
  if (rec) rec.stop(); // 发送时停止语音输入
  try { speechSynthesis.cancel(); } catch {} // 新一轮开始时停止朗读
  addUserMsg(text, imgs);
  sfx.send();
  ask(text, imgs).catch((e) => { showErrorCard("网络错误：" + e.message); sfx.error(); });
}
sendBtn.onclick = () => {
  const text = q.value.trim();
  const imgs = pendingImages;
  if (!text && imgs.length === 0) return;
  q.value = "";
  resizeQ();
  pendingImages = [];
  renderThumbs();
  submit(text, imgs);
};
/* textarea 自动伸缩 + Enter 发送 / Shift+Enter 换行 */
function resizeQ() {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 140) + "px";
}
q.addEventListener("input", resizeQ);
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});
restoreChatHistory();
q.focus();
</script>
